<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Details</title>

<style>
body{
font-family:Segoe UI, sans-serif;
background:url("flags-by.png") center/cover no-repeat fixed;
color:white;
padding:30px;
}

.container{
background:rgba(0,0,0,0.6);
-webkit-backdrop-filter:blur(15px);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
max-width:800px;
margin:auto;
text-align:center;
}

img{
width:100%;
max-width:400px;
border-radius:15px;
margin-bottom:15px;
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1 id="name"></h1>
<img id="flag" alt="Country Flag">

<p><b>Capital:</b> <span id="capital"></span></p>
<p><b>Population:</b> <span id="population"></span></p>
<p><b>Currency:</b> <span id="currency"></span></p>

<h3>History:</h3>
<p id="history"></p>

<br>

<button onclick="goToPage('person.html')">Famous Person</button>
<button onclick="goToPage('place.html')">Famous Place</button>
<button onclick="goToPage('food.html')">Famous Food</button>
<button onclick="window.location='index.html'">Back</button>

</div>

<script>

// Get country from URL
const params = new URLSearchParams(window.location.search);
const country = decodeURIComponent(params.get("country") || "");

if(!country){
alert("No country selected!");
}

// Fetch country info
fetch("https://restcountries.com/v3.1/name/" + encodeURIComponent(country))
.then(res=>res.json())
.then(data=>{
const c=data[0];

document.getElementById("name").textContent=c.name.common;

const flag=document.getElementById("flag");
flag.src=c.flags.png;
flag.alt="Flag of " + c.name.common;

document.getElementById("capital").textContent=
c.capital ? c.capital[0] : "N/A";

document.getElementById("population").textContent=
c.population.toLocaleString();

document.getElementById("currency").textContent=
c.currencies ? Object.values(c.currencies)[0].name : "N/A";
})
.catch(()=>{
document.getElementById("name").textContent="Country not found";
});

// Wikipedia history
fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(country))
.then(res=>res.json())
.then(data=>{
document.getElementById("history").textContent=
data.extract || "History not available.";
});

// Navigation function
function goToPage(page){
const encoded = encodeURIComponent(country);
window.location.href = page + "?country=" + encoded;
}

</script>

</body>
</html>
