<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Explorer</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI, sans-serif;
background:url("flags-by.png") center/cover no-repeat fixed;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
z-index:-1;
}

.container{
background:rgba(255,255,255,0.15);
-webkit-backdrop-filter:blur(15px);
backdrop-filter:blur(15px);
padding:40px;
border-radius:20px;
width:90%;
max-width:600px;
text-align:center;
}

h1{
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:10px;
margin-bottom:15px;
font-size:16px;
}

.country-list{
max-height:300px;
overflow-y:auto;
text-align:left;
}

.country-item{
display:flex;
gap:10px;
padding:8px;
cursor:pointer;
border-radius:8px;
align-items:center;
}

.country-item:hover{
background:rgba(255,255,255,0.2);
}

.country-item img{
width:25px;
height:18px;
object-fit:cover;
border-radius:3px;
}
</style>
</head>

<body>

<div class="container">
<h1>🌍 Country Explorer</h1>

<input 
type="text" 
id="searchInput" 
placeholder="Search country..." 
aria-label="Search country">

<div id="countryList" class="country-list"></div>

</div>

<script>
let allCountries=[];

// Fetch countries (stable version)
fetch("https://restcountries.com/v3.1/all?fields=name,flags")
.then(response=>{
if(!response.ok){
throw new Error("API connection failed");
}
return response.json();
})
.then(data=>{
allCountries=data.sort((a,b)=>
a.name.common.localeCompare(b.name.common)
);
displayCountries(allCountries);
})
.catch(error=>{
console.error(error);
alert("Cannot connect to API. Use Live Server and check internet.");
});

// Display countries
function displayCountries(countries){
const list=document.getElementById("countryList");
list.innerHTML="";

countries.forEach(country=>{
const div=document.createElement("div");
div.className="country-item";

div.innerHTML=`
<img src="${country.flags.png}" alt="Flag of ${country.name.common}">
<span>${country.name.common}</span>
`;

div.onclick=function(){
const selected=encodeURIComponent(country.name.common);
window.location.href="description.html?country="+selected;
};

list.appendChild(div);
});
}

// Live Search
document.getElementById("searchInput")
.addEventListener("input",function(){
const value=this.value.toLowerCase().trim();

const filtered=allCountries.filter(country=>{
return country.name.common.toLowerCase().includes(value);
});

displayCountries(filtered);
});
</script>

</body>
</html>
